version: 1
# Boundary from https://alint.org/blog/why-alint: alint checks the repository's
# filesystem shape, not code semantics. Keep existence, naming, content,
# structured config, cross-file relationships, and encoding checks here.
# Leave language analysis to Ruff/ESLint/Clippy, SAST to Semgrep/CodeQL,
# secrets to gitleaks/TruffleHog, dependency graphs to cargo-deny, and license
# identification to a license detector. Command rules select artifacts for
# specialists; they never reimplement a specialist's parser or verdict.
requires:
  alint: "0.21.0"
rules:
  - id: skills-have-authoring-specs
    kind: dir_contains
    select: "skills/*"
    require: ["spec.md"]
    level: error

  - id: installable-skills-are-valid
    kind: command
    paths: "skills/*/SKILL.md"
    command:
      - npx
      - -y
      - "@sentry/skillet@latest"
      - validate
      - "{dir}"
      - --json
    timeout: 120
    level: error

  - id: rendered-skills-match-their-spec
    kind: command
    paths: "skills/*/SKILL.md"
    command:
      - python3
      - scripts/check_skillet_freshness.py
      - "{dir}"
    timeout: 120
    level: error
