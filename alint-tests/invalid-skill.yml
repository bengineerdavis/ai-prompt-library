test_version: 1
name: a runtime skill missing YAML frontmatter is rejected
tags: [skills, format, failing]
capabilities:
  spawn: true
given:
  tree:
    skills:
      incomplete:
        spec.md: "# Draft authoring contract\n"
        SKILL.md: "# A runtime skill without frontmatter\n"
  config: |
    version: 1
    rules:
      - id: installable-skills-are-valid
        kind: command
        paths: "skills/*/SKILL.md"
        command: [npx, -y, "@sentry/skillet@latest", validate, "{dir}", --json]
        timeout: 120
        level: error
when: [check]
expect:
  - exit: policy_failure
    violations:
      - {rule: installable-skills-are-valid, level: error, path: skills/incomplete/SKILL.md}
