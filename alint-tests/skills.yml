test_version: 1
name: an installable skill without its authoring spec is rejected
tags: [skills, structure, failing]
given:
  tree:
    skills:
      incomplete:
        SKILL.md: |
          ---
          name: incomplete
          description: Incomplete fixture.
          ---
  config: |
    version: 1
    rules:
      - id: skills-have-authoring-specs
        kind: dir_contains
        select: "skills/*"
        require: ["spec.md"]
        level: error
when: [check]
expect:
  - exit: policy_failure
    violations:
      - {rule: skills-have-authoring-specs, level: error, path: skills/incomplete}
