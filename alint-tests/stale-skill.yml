test_version: 1
name: a rendered skill whose hash does not match its spec is rejected
tags: [skills, freshness, failing]
capabilities:
  spawn: true
given:
  tree:
    skills:
      stale:
        spec.md: "current spec\n"
        SKILL.md: |
          ---
          name: stale
          description: Stale fixture.
          spec_hash: "000000000000"
          ---
  config: |
    version: 1
    rules:
      - id: rendered-skills-match-their-spec
        kind: command
        paths: "skills/*/SKILL.md"
        command:
          - python3
          - -c
          - >-
            import hashlib, pathlib, re, sys; d = pathlib.Path("{dir}");
            expected = hashlib.sha256((d / "spec.md").read_bytes()).hexdigest()[:12];
            match = re.search(r"(?m)^spec_hash:\s*[\"']?([0-9a-f]+)", (d / "SKILL.md").read_text());
            sys.exit(0 if match and match.group(1) == expected else f"stale SKILL.md: expected spec_hash {expected}")
        level: error
when: [check]
expect:
  - exit: policy_failure
    violations:
      - {rule: rendered-skills-match-their-spec, level: error, path: skills/stale/SKILL.md}
