test_version: 1
name: a rendered skill whose hash does not match its spec is rejected
tags: [skills, freshness, failing]
capabilities:
  spawn: true
given:
  tree:
    scripts:
      check_skillet_freshness.py: |
        #!/usr/bin/env python3
        import json, subprocess, sys
        result = subprocess.run(
            ["npx", "-y", "@sentry/skillet@latest", "status", sys.argv[1], "--json"],
            capture_output=True, text=True, check=False,
        )
        if result.returncode:
            sys.stderr.write(result.stderr or result.stdout)
            raise SystemExit(result.returncode)
        report = json.loads(result.stdout)
        if report["skill"]["stale"]:
            print(report["next"], file=sys.stderr)
            raise SystemExit(1)
    skills:
      stale:
        spec.md: "current spec\n"
        SKILL.md: |
          ---
          name: stale
          description: Stale fixture.
          spec_hash: "000000000000"
          ---
  config: |
    version: 1
    rules:
      - id: rendered-skills-match-their-spec
        kind: command
        paths: "skills/*/SKILL.md"
        command: [python3, scripts/check_skillet_freshness.py, "{dir}"]
        timeout: 120
        level: error
when: [check]
expect:
  - exit: policy_failure
    violations:
      - {rule: rendered-skills-match-their-spec, level: error, path: skills/stale/SKILL.md}
