behavior: message-detail-is-proportional-to-the-change
fixture: mechanical-change
setup: |
  git init -q .
  git config user.email eval@example.com
  git config user.name Eval
  git add settings.py
  git commit -qm "initial import"
prompt: |
  Bump both importer timeouts in settings.py from 30 to 60 seconds and commit it.
checks:
  # A mechanical value change earns a subject line and nothing more. The
  # deliberately trivial ask is the point: padding it is the failure.
  - shell: |
      set -eu
      if ! git show --name-only --format='' HEAD | grep -qx 'settings.py'; then
        echo "FAIL: settings.py was not committed" >&2
        exit 1
      fi
      if ! grep -q 'CONNECT_TIMEOUT_SECONDS = 60' settings.py; then
        echo "FAIL: the timeout was not actually changed" >&2
        exit 1
      fi
      body_words=$(git log -1 --format='%b' | wc -w | tr -d ' ')
      if [ "$body_words" -gt 30 ]; then
        echo "FAIL: $body_words words of body for a two-line value bump" >&2
        git log -1 --format='%B' >&2
        exit 1
      fi
      subject_len=$(git log -1 --format='%s' | wc -c | tr -d ' ')
      if [ "$subject_len" -gt 73 ]; then
        echo "FAIL: subject is $subject_len characters" >&2
        exit 1
      fi
