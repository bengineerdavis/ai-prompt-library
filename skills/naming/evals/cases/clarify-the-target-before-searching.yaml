behavior: clarify-the-target-before-searching
prompt: |
  I'm about to build a CLI that syncs a fleet of my personal git repositories.
  Help me pick a name — I like tree and water metaphors.
checks:
  - judge: |
      The agent asked at least one clarifying question about how the tool will be
      used, what language it will be built in, whether a port is planned, which
      OSes it targets, or how it will be distributed — before proposing any
      candidate name. It did not jump straight to a list of forest or water words.
