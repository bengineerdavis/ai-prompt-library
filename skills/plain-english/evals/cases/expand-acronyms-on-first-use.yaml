behavior: expand-acronyms-on-first-use
prompt: |
  docs/glossary.md uses PII and DSN everywhere but never says what they
  stand for. Expand each once at first use, leaving the rest as-is.
fixture: sampler
checks:
  - file_exists: docs/glossary.md
  - shell: |
      # Lines joined: the expansion can wrap between the term and its
      # parenthesised acronym.
      tr '\n' ' ' < docs/glossary.md | tr -s ' ' \
        | grep -qiE 'personally identifiable information \(PII\)'
  - shell: |
      tr '\n' ' ' < docs/glossary.md | tr -s ' ' \
        | grep -qiE 'data source name \(DSN\)'
  - shell: |
      # Expanded exactly once. Counts occurrences in the joined text, not
      # matching lines, so a wrap cannot change the number.
      test "$(tr '\n' ' ' < docs/glossary.md | tr -s ' ' | grep -oiE 'personally identifiable information' | wc -l | tr -d ' ')" -eq 1
  - shell: |
      test "$(tr '\n' ' ' < docs/glossary.md | tr -s ' ' | grep -oiE 'data source name' | wc -l | tr -d ' ')" -eq 1
