behavior: one-name-for-one-thing
prompt: |
  docs/profile-guide.md keeps renaming the same artifact. Pick the dominant
  term and use it consistently.
fixture: sampler
checks:
  - file_exists: docs/profile-guide.md
  - shell: |
      # The drift must actually collapse: at most one of the three names left.
      c=0
      grep -qi 'configuration' docs/profile-guide.md && c=$((c+1))
      grep -qE '\bconfig\b' docs/profile-guide.md && c=$((c+1))
      test "$c" -le 1
  - judge: |
      The document now uses exactly one term for the artifact (chosen from the
      document's own dominant usage), the sentence count is unchanged, and no
      sentence gained or lost information.
