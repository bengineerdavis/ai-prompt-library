behavior: sentence-case-for-headings
prompt: |
  The top heading in docs/setup.md and docs/runbook.md is wrong on two
  counts: it is title case, and it opens with an -ing verb. Both name a
  task. Fix both headings.
fixture: sampler
checks:
  - file_exists: docs/setup.md
  - file_exists: docs/runbook.md
  - shell: |
      grep -q '^# Set up the verification gate$' docs/setup.md
  - shell: |
      grep -q '^# Purge expired retention records$' docs/runbook.md
