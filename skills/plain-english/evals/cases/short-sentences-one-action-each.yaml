behavior: short-sentences-one-action-each
prompt: |
  The runbook in docs/runbook.md is one long chained sentence. Rewrite the
  procedure as short numbered steps, one action per step.
fixture: sampler
checks:
  - file_exists: docs/runbook.md
  - shell: |
      # The rewrite must actually happen: imperative numbered steps, and the
      # third-person narration is gone.
      grep -qE '^[0-9]+\. ' docs/runbook.md
  - shell: |
      ! grep -q 'The user should' docs/runbook.md
  - shell: |
      ! grep -qE ';| — | -- ' docs/runbook.md
  - judge: |
      The procedure is now a numbered sequence of imperative steps, each with
      one action and no sentence over ~25 words, and every original condition
      and action survives the rewrite.
